services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopensemble
      POSTGRES_USER: shopensemble
      POSTGRES_PASSWORD: shopensemble
    ports:
      - "5432:5432"
    volumes:
      - shopensemble-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopensemble -d shopensemble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopensemble-postgres-data:
